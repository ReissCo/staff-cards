<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#171a26; --ink2:#0f1220; --muted:#9aa0b4; --bg:#e1e6e7; --line:#cdd3d4; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    font-family:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background-color:var(--bg);
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:42px 42px;
  }
  .card {
    position:relative; width:100%; max-width:360px; color:#fff; border-radius:28px; padding:28px 26px 26px;
    background:linear-gradient(180deg, var(--ink) 0%, var(--ink2) 100%);
    box-shadow:0 30px 50px -20px rgba(15,18,32,.55);
    clip-path:polygon(0 0, calc(100% - 58px) 0, 100% 58px, 100% 100%, 0 100%);
    border-radius:28px; animation:rise .5s ease both;
  }
  @keyframes rise { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce) { .card { animation:none; } }
  .top { display:flex; justify-content:space-between; font-size:14px; margin-bottom:26px; padding-right:40px; }
  .top b { font-weight:700; } .top span { color:var(--muted); }
  .mono {
    width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:22px;
    background:#2a3050; letter-spacing:.5px; margin-bottom:16px;
  }
  h1 { font-size:24px; line-height:1.2; margin:0 0 4px; font-weight:700; }
  .role { color:var(--muted); font-size:15px; margin:0 0 22px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid #262b42; font-size:14px; }
  .row .k { color:var(--muted); flex:none; }
  .row .v { text-align:right; word-break:break-word; }
  button.v { all:unset; cursor:pointer; text-align:right; word-break:break-word; color:#fff; }
  button.v:hover { text-decoration:underline; }
  .save {
    margin-top:18px; width:100%; padding:13px; border:0; border-radius:14px; cursor:pointer;
    background:#fff; color:var(--ink); font:inherit; font-weight:700;
  }
  .msg { color:var(--muted); line-height:1.5; margin:0; }
  .msg b { color:#fff; }
</style>
</head>
<body>
<main class="card" id="card"><p class="msg">Loading…</p></main>

<script>
(function () {
  var card = document.getElementById('card');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // stricter normalizer for ids/keys: trim, lowercase, remove hidden/non-alnum except hyphen
  function normId(s) {
    return String(s == null ? '' : s).trim().toLowerCase().replace(/[^a-z0-9\-]/g, '');
  }

  function titleCase(s) {
    return String(s || '').toLowerCase().replace(/(^|[\s\-.'])([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); });
  }
  function intl(phone) {
    var d = String(phone || '').replace(/[^\d+]/g, '');
    if (!d) return '';
    if (d.charAt(0) === '+') return d;
    if (d.charAt(0) === '0') return '+233' + d.slice(1);
    return '+233' + d;
  }
  function message(html) {
    card.innerHTML = '';
    var top = el('div', 'top'); top.appendChild(el('b', null, 'Reiss & Co')); top.appendChild(el('span', null, 'Staff ID'));
    card.appendChild(top);
    var p = el('p', 'msg'); p.appendChild(html); card.appendChild(p);
  }
  function note(prefix, strong, suffix) {
    var f = document.createDocumentFragment();
    f.appendChild(document.createTextNode(prefix));
    if (strong) f.appendChild(el('b', null, strong));
    if (suffix) f.appendChild(document.createTextNode(suffix));
    return f;
  }

  function findRecord(data, id) {
    var key = normId(id);
    if (!key) return null;
    if (Array.isArray(data)) {
      for (var i = 0; i < data.length; i++) {
        var rec = data[i];
        // check common possible fields and normalise
        var cand = normId(rec.employeeId || rec.employeeID || rec.id || '');
        if (cand === key) return rec;
      }
      // last resort: search any property for matching id-ish value
      for (i = 0; i < data.length; i++) {
        var r = data[i];
        for (var prop in r) {
          if (r.hasOwnProperty(prop)) {
            if (normId(String(r[prop])) === key) return r;
          }
        }
      }
      return null;
    }
    for (var k in data) { if (normId(k) === key) return data[k]; }
    return null;
  }

  function copyText(text, btn) {
    var done = function () { var old = btn.textContent; btn.textContent = 'copied'; setTimeout(function () { btn.textContent = old; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
    else done();
  }

  function render(p) {
    var name = titleCase(p.fullName || p.name || ((p.firstName || '') + ' ' + (p.surname || '')));
    var role = p.jobTitle || p.position || '';
    var initials = name.split(/\s+/).filter(Boolean).map(function (w) { return w[0]; });
    initials = (initials[0] || '') + (initials.length > 1 ? initials[initials.length - 1] : '');

    card.innerHTML = '';
    var top = el('div', 'top'); top.appendChild(el('b', null, 'Reiss & Co')); top.appendChild(el('span', null, 'Staff ID'));
    card.appendChild(top);
    card.appendChild(el('div', 'mono', initials.toUpperCase()));
    card.appendChild(el('h1', null, name));
    if (role) card.appendChild(el('p', 'role', role));

    function row(label, value, copyable) {
      if (!value) return;
      var r = el('div', 'row'); r.appendChild(el('span', 'k', label));
      if (copyable) {
        var b = el('button', 'v', value); b.type = 'button';
        b.addEventListener('click', function () { copyText(value, b); });
        r.appendChild(b);
      } else r.appendChild(el('span', 'v', value));
      card.appendChild(r);
    }
    row('Employee ID', p.employeeId || p.id);
    row('Department', p.department);
    row('Type', p.employmentType);
    row('Phone', p.phone, true);
    row('Email', p.email, true);

    var save = el('button', 'save', 'Save to contacts'); save.type = 'button';
    save.addEventListener('click', function () {
      var tel = intl(p.phone);
      var lines = ['BEGIN:VCARD', 'VERSION:3.0',
        'N:' + (p.surname ? titleCase(p.surname) : '') + ';' + (p.firstName || '') + ';;;',
        'FN:' + name, 'ORG:Reiss & Co'];
      if (role) lines.push('TITLE:' + role);
      if (tel) lines.push('TEL;TYPE=CELL:' + tel);
      if (p.email) lines.push('EMAIL:' + p.email);
      lines.push('END:VCARD');
      var blob = new Blob([lines.join('\r\n')], { type: 'text/vcard' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name.replace(/\s+/g, '_') + '.vcf';
      document.body.appendChild(a); a.click(); a.remove();
    });
    card.appendChild(save);
    document.title = name + ' · Reiss & Co';
  }

  // Get id from query string (case-insensitive for key) or fallback to plain hash/text
  var params = new URLSearchParams(location.search);
  var id = params.get('id') || params.get('ID') || params.get('Id');

  if (!id) {
    // forgiving fallback:
    var raw = decodeURIComponent((location.search || location.hash || '').replace(/^[?#]/, '')).replace(/^=/, '').replace(/^id=/i, '').trim();
    // if the scanner produced a plain id (e.g. "ADM98174") or "#ADM98174"
    if (/^[A-Za-z0-9\-]+$/.test(raw)) id = raw;
  }

  if (!id) { message(note('No staff ID in this link. Scan the QR code on a staff card.')); return; }

  // Diagnostic: see what id we are trying to find (open devtools to view)
  console.log('Staff card id ->', JSON.stringify(id));

  // Use absolute URL for staff.json relative to the current page to avoid relative path surprises
  var staffUrl = new URL('staff.json', location.href).href;
  console.log('Fetching staff data from', staffUrl);

  fetch(staffUrl, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      console.log('Loaded staff data:', Array.isArray(data) ? ('array length:' + data.length) : typeof data, data && data.slice && data.slice(0,2));
      var p = findRecord(data, id);
      if (p) render(p);
      else message(note('No record found for id ', id.trim(), '. Check the link and try again.'));
    })
    .catch(function (err) {
      console.error('Failed to load staff.json:', err);
      message(note('Could not load staff data. Please try again later.'));
    });
})();
</script>
</body>
</html>
